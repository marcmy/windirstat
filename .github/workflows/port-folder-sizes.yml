name: Port treemap folder sizes

on:
  push:
    branches: [port-folder-sizes-2026-09-08]
    paths: [.github/workflows/port-folder-sizes.yml]

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, 'Complete folder-size port') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: port-folder-sizes-2026-09-08
          fetch-depth: 0
      - name: Port feature onto current upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected anchor missing in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8-sig')

          # Renderer option and default.
          replace_once(
              'windirstat/Controls/TreeMap.h',
              '        bool showFolderFrames; // Whether to draw folder borders and headers\n        bool contrastLabels;',
              '        bool showFolderFrames; // Whether to draw folder borders and headers\n        bool showFolderSizes; // Whether to append sizes to folder frame headers\n        bool contrastLabels;',
          )
          replace_once(
              'windirstat/Controls/TreeMap.h',
              '        .showFolderFrames = false,\n        .contrastLabels = false,',
              '        .showFolderFrames = false,\n        .showFolderSizes = false,\n        .contrastLabels = false,',
          )

          # Retain a measured header label so rendering can use name + formatted size when it fits.
          replace_once(
              'windirstat/Controls/TreeMap.cpp',
              '        int depth;\n        bool showHeader;\n    };',
              '        int depth;\n        bool showHeader;\n        std::wstring label;\n    };',
          )
          replace_once(
              'windirstat/Controls/TreeMap.cpp',
              '''            std::wstring_view name = item->GetNameView(true);\n            const int textWidth = state.rc.Width() - 8;\n            CSize nameSize;\n            GetTextExtentPoint32W(dc, name.data(), static_cast<int>(name.size()), &nameSize);\n            const bool showHeader = state.rc.Height() > headerHeight && nameSize.cx <= textWidth;\n\n            foldersToDraw.push_back({ item, state.rc, state.depth, showHeader });''',
              '''            std::wstring_view name = item->GetNameView(true);\n            const int textWidth = state.rc.Width() - 8;\n            CSize nameSize;\n            GetTextExtentPoint32W(dc, name.data(), static_cast<int>(name.size()), &nameSize);\n            const bool showHeader = state.rc.Height() > headerHeight && nameSize.cx <= textWidth;\n            std::wstring label;\n            if (showHeader)\n            {\n                label.assign(name);\n                if (m_options.showFolderSizes)\n                {\n                    std::wstring sizedLabel = std::format(L"{} ({})", name, FormatBytes(item->TmiGetSize()));\n                    CSize sizedLabelSize;\n                    GetTextExtentPoint32W(dc, sizedLabel.c_str(), static_cast<int>(sizedLabel.size()), &sizedLabelSize);\n                    if (sizedLabelSize.cx <= textWidth) label = std::move(sizedLabel);\n                }\n            }\n\n            foldersToDraw.push_back({ item, state.rc, state.depth, showHeader, std::move(label) });''',
          )
          replace_once(
              'windirstat/Controls/TreeMap.cpp',
              '''                    CRect rcText(rcHeader.left + 3, rcHeader.top, rcHeader.right - 3, rcHeader.bottom);\n                    std::wstring_view name = folder.item->GetNameView(true);\n                    SetTextColor(dc, RGB(0, 0, 0));\n                    DrawTextW(dc, name.data(), static_cast<int>(name.size()), &rcText,\n                        DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_NOPREFIX);''',
              '''                    CRect rcText(rcHeader.left + 3, rcHeader.top, rcHeader.right - 3, rcHeader.bottom);\n                    SetTextColor(dc, RGB(0, 0, 0));\n                    DrawTextW(dc, folder.label.c_str(), static_cast<int>(folder.label.size()), &rcText,\n                        DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_NOPREFIX);''',
          )

          # Persist the option.
          replace_once(
              'windirstat/Options.h',
              '    inline static Setting<bool> TreeMapShowFolderFrames{ OptionsTreeMap, L"TreeMapShowFolderFrames", (CTreeMap::GetDefaults().showFolderFrames) };\n',
              '    inline static Setting<bool> TreeMapShowFolderFrames{ OptionsTreeMap, L"TreeMapShowFolderFrames", (CTreeMap::GetDefaults().showFolderFrames) };\n    inline static Setting<bool> TreeMapShowFolderSizes{ OptionsTreeMap, L"TreeMapShowFolderSizes", (CTreeMap::GetDefaults().showFolderSizes) };\n',
          )
          replace_once(
              'windirstat/Options.cpp',
              '    TreeMapShowFolderFrames = TreeMapOptions.showFolderFrames;\n',
              '    TreeMapShowFolderFrames = TreeMapOptions.showFolderFrames;\n    TreeMapShowFolderSizes = TreeMapOptions.showFolderSizes;\n',
          )
          replace_once(
              'windirstat/Options.cpp',
              '    TreeMapOptions.showFolderFrames = TreeMapShowFolderFrames;\n',
              '    TreeMapOptions.showFolderFrames = TreeMapShowFolderFrames;\n    TreeMapOptions.showFolderSizes = TreeMapShowFolderSizes;\n',
          )

          # Main-frame command handlers and routes.
          replace_once(
              'windirstat/MainFrame.Commands.cpp',
              '''void CMainFrame::OnUpdateViewShowFolderFramesOnTreeMap(CCmdUI* pCmdUI) const\n{\n    pCmdUI->Enable(GetGraphPaneType() == GraphPane::TreeMap\n        && !CWinDirStatModel::Get()->IsScanRunning());\n    pCmdUI->SetCheck(COptions::TreeMapOptions.showFolderFrames);\n}\n''',
              '''void CMainFrame::OnUpdateViewShowFolderFramesOnTreeMap(CCmdUI* pCmdUI) const\n{\n    pCmdUI->Enable(GetGraphPaneType() == GraphPane::TreeMap\n        && !CWinDirStatModel::Get()->IsScanRunning());\n    pCmdUI->SetCheck(COptions::TreeMapOptions.showFolderFrames);\n}\n\nvoid CMainFrame::OnViewShowFolderSizesOnTreeMap() const\n{\n    if (GetGraphPaneType() != GraphPane::TreeMap) return;\n\n    COptions::TreeMapShowFolderSizes = !static_cast<bool>(COptions::TreeMapShowFolderSizes);\n    COptions::TreeMapOptions.showFolderSizes = COptions::TreeMapShowFolderSizes;\n    CWinDirStatModel::Get()->NotifyPanes(MODEL_CHANGE_TREEMAP_STYLE);\n}\n\nvoid CMainFrame::OnUpdateViewShowFolderSizesOnTreeMap(CCmdUI* pCmdUI) const\n{\n    pCmdUI->Enable(GetGraphPaneType() == GraphPane::TreeMap\n        && !CWinDirStatModel::Get()->IsScanRunning()\n        && COptions::TreeMapOptions.showFolderFrames);\n    pCmdUI->SetCheck(COptions::TreeMapOptions.showFolderSizes);\n}\n''',
          )
          replace_once(
              'windirstat/MainFrame.h',
              '    void OnViewShowFolderFramesOnTreeMap() const;\n    void OnUpdateViewShowFolderFramesOnTreeMap(CCmdUI* pCmdUI) const;\n',
              '    void OnViewShowFolderFramesOnTreeMap() const;\n    void OnUpdateViewShowFolderFramesOnTreeMap(CCmdUI* pCmdUI) const;\n    void OnViewShowFolderSizesOnTreeMap() const;\n    void OnUpdateViewShowFolderSizesOnTreeMap(CCmdUI* pCmdUI) const;\n',
          )
          replace_once(
              'windirstat/MainFrame.h',
              '        Route::Command<&OnViewShowFolderFramesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_FRAMES),\n        Route::Update<&OnUpdateViewShowFolderFramesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_FRAMES),\n',
              '        Route::Command<&OnViewShowFolderFramesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_FRAMES),\n        Route::Update<&OnUpdateViewShowFolderFramesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_FRAMES),\n        Route::Command<&OnViewShowFolderSizesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_SIZES),\n        Route::Update<&OnUpdateViewShowFolderSizesOnTreeMap>(ID_TREEMAP_SHOW_FOLDER_SIZES),\n',
          )

          # Keep the command in treemap context menus while the pane is active.
          replace_once(
              'windirstat/Views/TreeMapView.cpp',
              '    static constexpr std::array<UINT, 9> persistentCommands{',
              '    static constexpr std::array<UINT, 10> persistentCommands{',
          )
          replace_once(
              'windirstat/Views/TreeMapView.cpp',
              '        ID_TREEMAP_SHOW_FOLDER_FRAMES,\n        ID_TREEMAP_SHOW_EXTENSIONS,',
              '        ID_TREEMAP_SHOW_FOLDER_FRAMES,\n        ID_TREEMAP_SHOW_FOLDER_SIZES,\n        ID_TREEMAP_SHOW_EXTENSIONS,',
          )

          # Command ID 32976 is upstream's current next free ID.
          replace_once(
              'windirstat/resource.h',
              '#define ID_VIEW_TOOLBAR_SIZE_USE_WINDOWS 32975\n#define IDS_AUTHOR_EMAIL',
              '#define ID_VIEW_TOOLBAR_SIZE_USE_WINDOWS 32975\n#define ID_TREEMAP_SHOW_FOLDER_SIZES    32976\n#define IDS_AUTHOR_EMAIL',
          )
          replace_once(
              'windirstat/resource.h',
              '#define _APS_NEXT_COMMAND_VALUE         32976',
              '#define _APS_NEXT_COMMAND_VALUE         32977',
          )

          # Add the menu command in every menu that exposes folder frames.
          rc = Path('windirstat/windirstat.rc')
          rc_text = rc.read_text(encoding='utf-8-sig')
          if 'ID_TREEMAP_SHOW_FOLDER_SIZES' not in rc_text:
              lines = rc_text.splitlines(keepends=True)
              out = []
              inserted = 0
              for line in lines:
                  out.append(line)
                  if 'MENUITEM' in line and 'ID_TREEMAP_SHOW_FOLDER_FRAMES' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = '\r\n' if line.endswith('\r\n') else '\n'
                      out.append(f'{indent}MENUITEM "IDS_MENU_TREEMAP_SHOW_FOLDER_SIZES", ID_TREEMAP_SHOW_FOLDER_SIZES{newline}')
                      inserted += 1
              if inserted != 2:
                  raise SystemExit(f'Expected two folder-frame menu locations, found {inserted}')
              rc.write_text(''.join(out), encoding='utf-8-sig')

          replace_once(
              'windirstat/res/langs/lang_en.txt',
              'IDS_MENU_TREEMAP_SHOW_FOLDER_FRAMES=Show Folder &Frames\n',
              'IDS_MENU_TREEMAP_SHOW_FOLDER_FRAMES=Show Folder &Frames\nIDS_MENU_TREEMAP_SHOW_FOLDER_SIZES=Show Folder Si&zes\n',
          )
          '@ | Set-Content -LiteralPath $env:RUNNER_TEMP\port_folder_sizes.py -Encoding utf8
          python $env:RUNNER_TEMP\port_folder_sizes.py
          git add -A
          git rm -- .github/workflows/port-folder-sizes.yml

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build x64 Release
        shell: pwsh
        run: msbuild windirstat.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:ExternalCompilerOptions=/DPRODUCTION=0
      - name: Commit verified port
        shell: pwsh
        run: |
          git add -A
          git commit -m 'Complete folder-size port onto current upstream'
          git push origin HEAD:port-folder-sizes-2026-09-08
